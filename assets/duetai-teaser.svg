<text x="110" y="318" fill="#858585" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">□ define approach</text>
<text x="110" y="347" fill="#858585" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">□ identify risks</text>
<text x="110" y="376" fill="#858585" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">□ review diff</text>

<!-- Codex / execution -->
<rect x="688" y="150" width="450" height="270" rx="24" fill="#0b1117" stroke="#347fba" stroke-width="2"/>
<circle cx="720" cy="184" r="6" fill="#59aef7"/>
<text x="742" y="193" fill="#63b5fb" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27" font-weight="700">Codex</text>
