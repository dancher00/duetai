<rect x="714" y="255" width="398" height="132" rx="14" fill="#090d11" stroke="#1c2b38"/>
<text x="736" y="286" fill="#d6d6d6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">$ implement plan</text>
<text x="736" y="318" fill="#7f96aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">✓ writing files</text>
<text x="736" y="347" fill="#7f96aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">✓ running tests</text>
<text x="736" y="376" fill="#7f96aa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">✓ applying fixes</text>

