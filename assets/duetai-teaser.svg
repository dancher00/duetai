<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 130 1200 400">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#11151b"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#e9855b"/><stop offset=".52" stop-color="#7f8793"/><stop offset="1" stop-color="#59aef7"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect y="130" width="1200" height="400" rx="28" fill="url(#bg)"/>
<rect x="1" y="131" width="1198" height="398" rx="27" fill="none" stroke="#262c35"/>

<!-- Claude / reasoning -->
<rect x="62" y="150" width="450" height="270" rx="24" fill="#120f0d" stroke="#b9603d" stroke-width="2"/>
<circle cx="94" cy="184" r="6" fill="#e9855b"/>
<text x="116" y="193" fill="#f08a61" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="27" font-weight="700">Claude Code</text>
<text x="92" y="228" fill="#9c8479" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="2">THINKS · PLANS · REVIEWS</text>
<rect x="88" y="255" width="398" height="132" rx="14" fill="#0d0d0d" stroke="#2d2521"/>
